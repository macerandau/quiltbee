# Quilt Bee — iOS build on Codemagic (no local Mac needed)
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic          # the App Store Connect API key saved in Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.quiltbee.app
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.quiltbee.app
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
    triggering:
      events: [push]
      branch_patterns:
        - pattern: master
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install npm packages
        script: npm ci --no-audit --no-fund
      - name: Copy the web app into the iOS project
        script: npx cap sync ios
      - name: Use the signing profiles Codemagic fetched from Apple
        script: xcode-project use-profiles
      - name: Set the build number from the Codemagic build counter
        script: |
          cd ios/App
          agvtool new-version -all $((BUILD_NUMBER + 1))
      - name: Build the signed .ipa
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # upload only; internal testers get it without beta review
